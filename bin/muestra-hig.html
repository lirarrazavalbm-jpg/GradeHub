$('tema').onclick=()=>{const oscuro=document.documentElement.dataset.modo!=='oscuro';document.documentElement.dataset.modo=oscuro?'oscuro':'claro';$('tema').textContent=oscuro?'Modo claro':'Modo oscuro';$('tema').setAttribute('aria-label','Cambiar a '+$('tema').textContent.toLowerCase());};
$('reiniciar').onclick=()=>{profesores=JSON.parse(originales);filtro='';precioDesde='',precioHasta='',soloGratis=false;busqueda='';mostrar();showToast('La muestra volvió a su estado inicial.');};
mostrar();
</script></body></html>
