<!doctype html>
<!--
GradeHub: logo.svg es la fuente única; icon.svg le agrega el fondo oscuro.
Exportación offline de los PNG.
El fondo completo es opaco para los iconos maskable, y la marca queda dentro
de la zona central; no se regeneran geometría ni colores en otra herramienta.

Desde la raíz del repo, en macOS (Chrome y sips):
  node bin/preparar-icono.cjs
  ICON_TMP=$(mktemp -d /tmp/gradehub-iconos.XXXXXX)
  /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome \
    --headless=new --disable-gpu --hide-scrollbars --allow-file-access-from-files \
    --user-data-dir="$ICON_TMP/profile" --force-device-scale-factor=2 \
    --window-size=512,512 --screenshot="$ICON_TMP/icono-2x.png" \
    "file://$PWD/bin/iconos.html"
  sips -z 512 512 "$ICON_TMP/icono-2x.png" --out icon-512.png
  sips -z 192 192 "$ICON_TMP/icono-2x.png" --out icon-192.png

Para la tarjeta social, ver bin/og-editorial.html.
-->
<html lang="es">
<head><meta charset="utf-8"><title>GradeHub · Iconos</title>
<style>html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#111113}img{display:block;width:512px;height:512px}</style>
</head><body><img src="../icon.svg" width="512" height="512" alt="GradeHub"></body>
</html>
