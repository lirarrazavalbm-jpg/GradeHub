name: tests

on:
  push:
    branches: [main]
  pull_request:

# Repo público: cualquiera puede abrir un PR. El token solo necesita leer.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      # Ya no compara contra la base —el número lo pone el deploy, no el PR—,
      # solo revisa que las dos mitades del sellado sigan puestas. Corre siempre,
      # también en push a main: el mecanismo se puede romper sin pasar por un PR.
      - name: Sellado del CACHE_NAME
        run: bash bin/check-cache-name.sh

  # Avisa que el token de Cloudflare sirve ANTES de mergear, en vez de
  # descubrirlo cuando el deploy ya falló. No publica nada: solo lista proyectos.
  credenciales:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: El token puede ver Cloudflare Pages
        run: npx --no-install wrangler pages project list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
