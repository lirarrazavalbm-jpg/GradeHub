name: deploy

# Mergear a main publica en gradehub.cl. Los tests corren primero: si fallan,
# el deploy no ocurre — esa es la única red real que protege producción.
on:
  push:
    branches: [main]
  # Para reintentar un deploy sin inventar un commit: Actions → deploy → Run workflow
  workflow_dispatch:

# Si se mergean dos PRs seguidos, que no se pisen dos deploys en paralelo.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

# El deploy no escribe en el repo: solo lee el código y publica en Cloudflare.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Dependencias fijadas
        run: npm ci

      - name: Tests
        run: npm test

      # CACHE_NAME y los assets salen de acá, no del repo. Si esto no corre,
      # un HTML nuevo puede pedir un JS viejo desde cache y dejar la app a
      # medias. Por eso cada sed va con `grep -q` antes: preferimos romper el
      # deploy a publicar una app que se congela en la versión instalada.
      - name: Sellar cache y assets con el commit
        run: |
          ASSET_VERSION="${GITHUB_SHA::7}"
          grep -q "'gradehub-dev'" sw.js || {
            echo "sw.js no tiene el marcador 'gradehub-dev'."
            echo "Alguien volvió a escribir el CACHE_NAME a mano. Sin marcador no hay"
            echo "nada que sellar y el deploy publicaría un cache que no cambia."
            exit 1
          }
          grep -q '__ASSET_VERSION__' index.html || {
            echo "index.html no tiene marcadores de versión para los assets."
            exit 1
          }
          grep -q '__ASSET_VERSION__' sw.js || {
            echo "sw.js no tiene marcadores de versión para los assets."
            exit 1
          }
          sed -i "s/'gradehub-dev'/'gradehub-${GITHUB_SHA::7}'/" sw.js
          sed -i "s/__ASSET_VERSION__/${ASSET_VERSION}/g" index.html sw.js
          grep -n 'CACHE_NAME' sw.js | head -1

      # Pages sube el directorio que se le pase, tal cual. Pasarle `.` publicaba
      # el repo entero en gradehub.cl: AGENTS.md con la lista de lo que todavía
      # no está asegurado, el esquema en supabase/*.sql y los tests, que
      # describen los vectores conocidos con carga útil incluida. Ningún secreto,
      # pero es un mapa escrito por nosotros y servido a cualquiera.
      #
      # Se excluye en vez de elegir: si mañana alguien agrega un archivo y esta
      # lista no lo menciona, se publica igual —que es el comportamiento de
      # siempre— en vez de desaparecer del sitio sin que nadie lo note.
      - name: Armar lo que se publica
        run: |
          ASSET_VERSION="${GITHUB_SHA::7}"
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude '.git' --exclude '.github' --exclude '.netlify' \
            --exclude '.wrangler' --exclude 'node_modules' --exclude 'dist' \
            --exclude 'tests' --exclude 'supabase' --exclude 'bin' \
            --exclude '*.md' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude '.gitignore'

          # La red que impide que una exclusión mal escrita borre la app. Con
          # usuarios adentro, publicar de menos es peor que publicar de más.
          for f in index.html 404.html preguntas.html privacidad.html \
                   data.js engine.js app.js app-session.js marketplace.js render-main.js render-agenda.js styles.css sw.js \
                   manifest.json _headers robots.txt sitemap.xml \
                   icon.svg icon-192.png icon-512.png og.png \
                   'functions/cal/[token].js'; do
            [ -e "dist/$f" ] || { echo "FALTA en dist: $f — no se publica nada"; exit 1; }
          done

          # El sellado ocurre antes de copiar: si no llegó, el service worker
          # publicado se congela en la versión instalada y nadie recibe nunca
          # una actualización.
          grep -q "gradehub-${GITHUB_SHA::7}" dist/sw.js || {
            echo "dist/sw.js no quedó sellado con el commit"; exit 1; }

          # Cada asset que pide el HTML tiene que existir con exactamente la
          # misma URL en el precache. Una URL sin SHA puede devolver código de
          # un deploy anterior aunque la navegación ya haya traído HTML nuevo.
          for asset in styles.css data.js engine.js app.js app-session.js marketplace.js render-main.js render-agenda.js; do
            grep -Fq "\"${asset}?v=${ASSET_VERSION}\"" dist/index.html || {
              echo "dist/index.html no selló ${asset}"; exit 1; }
            grep -Fq "'/${asset}?v=${ASSET_VERSION}'" dist/sw.js || {
              echo "dist/sw.js no precachea ${asset} sellado"; exit 1; }
          done

          # Las páginas se siguen navegando network-first y el fallback offline
          # busca /index.html sin versión. Versionarlas rompería ese camino.
          for page in / /index.html /preguntas.html /privacidad.html; do
            grep -Fq "'${page}'" dist/sw.js || {
              echo "dist/sw.js perdió la página ${page} del SHELL"; exit 1; }
            ! grep -Fq "'${page}?v=" dist/sw.js || {
              echo "dist/sw.js versionó la página ${page}"; exit 1; }
          done

          echo "Se publican $(find dist -type f | wc -l) archivos"
          echo "Fuera del deploy: $(ls -A | grep -Ev '^(dist|\.git)$' | tr '\n' ' ')"

      - name: Publicar en Cloudflare Pages
        run: npx --no-install wrangler pages deploy dist --project-name gradehub --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
