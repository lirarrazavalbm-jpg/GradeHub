name: deploy

# Mergear a main publica en gradehub.cl. Los tests corren primero: si fallan,
# el deploy no ocurre — esa es la única red real que protege producción.
on:
  push:
    branches: [main]
  # Para reintentar un deploy sin inventar un commit: Actions → deploy → Run workflow
  workflow_dispatch:

# Si se mergean dos PRs seguidos, que no se pisen dos deploys en paralelo.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

# El deploy no escribe en el repo: solo lee el código y publica en Cloudflare.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias fijadas
        run: npm ci

      - name: Tests
        run: npm test

      # El CACHE_NAME sale de acá, no del repo. Si esto no corre, todos los
      # deploys publican 'gradehub-dev', el service worker nunca cambia de cache
      # y nadie recibe una actualización nunca más — sin que falle nada visible.
      # Por eso el sed va con `grep -q` antes: preferimos romper el deploy a
      # publicar una app que se congela en la versión instalada.
      - name: Sellar el CACHE_NAME con el commit
        run: |
          grep -q "'gradehub-dev'" sw.js || {
            echo "sw.js no tiene el marcador 'gradehub-dev'."
            echo "Alguien volvió a escribir el CACHE_NAME a mano. Sin marcador no hay"
            echo "nada que sellar y el deploy publicaría un cache que no cambia."
            exit 1
          }
          sed -i "s/'gradehub-dev'/'gradehub-${GITHUB_SHA::7}'/" sw.js
          grep -n 'CACHE_NAME' sw.js | head -1

      - name: Publicar en Cloudflare Pages
        run: npx --no-install wrangler pages deploy . --project-name gradehub --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
